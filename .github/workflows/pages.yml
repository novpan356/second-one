name: Deploy TEKKEN ATLAS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test data and queries
        run: npm test
      - name: Build static site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_API_URL: ${{ vars.VITE_PLAYER_API_URL }}
        run: npm run build
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Retain preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: symcrew-preview-debug-signing-v1
      - name: Install Android SDK target
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Bundle offline assets and Android plugins
        run: npx --no-install cap sync android
      - name: Build and lint Android preview
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test bundled app offline on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && ./gradlew --no-daemon --console=plain connectedDebugAndroidTest
      - name: Save native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
      - name: Verify and publish Android download
        run: |
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/downloads/SYM-CREW-Android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/downloads/SYM-CREW-Android.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/downloads/SYM-CREW-Android.apk > dist/downloads/apk-info.txt
          cd dist/downloads
          sha256sum SYM-CREW-Android.apk > SHA256SUMS.txt
      - name: Save Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYM-CREW-Android-preview
          path: dist/downloads/
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
